services:
  - type: web
    name: jj-arena-live
    autoDeployTrigger: checksPass
    runtime: python
    plan: 0.5c-512mb
    region: singapore
    buildCommand: pip install -r requirements.txt && python smoke_test_v190.py
    startCommand: python -m uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: WEB_CONCURRENCY
        value: "1"
      - key: JJ_ADMIN_NAME
        value: ケンイチロウ
      - key: JJ_ENABLE_DEMO_MEMBER
        value: "0"
