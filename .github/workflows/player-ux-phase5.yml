name: JJ Arena Player UX Phase 4B

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'ux/player-audit-phase4b*'

permissions:
  contents: read

jobs:
  # Job id intentionally remains `phase4b` because main branch protection uses
  # this historical check name. The implementation now validates the canonical
  # frontend pipeline rather than reconstructing phase1→phase5 inside YAML.
  phase4b:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install production and test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install httpx==0.28.1

      - name: Build canonical served browser assets
        run: python build_served_assets.py

      - name: Compile phase 4B compatibility tests
        run: python -m py_compile player_ux_phase5.py player_ux_phase5_mobile.py smoke_test_player_ux_phase5.py smoke_test_player_ux_phase5_layout.py frontend_build_pipeline.py

      - name: Check final served JavaScript syntax
        run: node --check .jj_build/static/app.js

      - name: Run phase 4B safety regression
        run: python smoke_test_player_ux_phase5.py

      - name: Run phase 4B real-browser layout regression
        run: python smoke_test_player_ux_phase5_layout.py

      - name: Verify final frontend contract
        run: |
          python smoke_test_frontend_pipeline.py
          python smoke_test_learning_contrast.py
