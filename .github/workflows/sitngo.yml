name: Sit&Go tournament gameplay
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  sitngo-gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - run: python -m pip install -r requirements.txt httpx playwright==1.58.0
      - run: node --check admin_static/admin_sitngo.js
      - run: python build_served_assets.py
      - run: python smoke_test_sitngo_phase1.py
      - run: python smoke_test_sitngo_points.py
      - run: python smoke_test_sitngo_chip_rules.py
      - run: python smoke_test_sitngo_tournament_rules.py
      - run: python smoke_test_sitngo_elimination_ranking.py
      - run: python smoke_test_sitngo_hand_levels.py
      - run: python smoke_test_sitngo_action_safety.py
      - run: python smoke_test_sitngo_freezeout_contract.py
      - run: python -c "from production_release_gate import _run_test; _run_test('smoke_test_sitngo_gameplay.py')"
      - run: python smoke_test_sitngo_api.py
      - run: python smoke_test_sitngo_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sitngo-browser
          path: test-artifacts/sitngo
  sitngo-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jj_sitngo_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jj_sitngo_ci
      JJ_ENABLE_DEMO_MEMBER: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: python -m pip install -r requirements.txt httpx
      - run: python build_served_assets.py
      - run: python smoke_test_sitngo_phase1.py
      - run: python smoke_test_sitngo_points.py
      - run: python smoke_test_sitngo_chip_rules.py
      - run: python smoke_test_sitngo_tournament_rules.py
      - run: python smoke_test_sitngo_elimination_ranking.py
      - run: python smoke_test_sitngo_hand_levels.py
      - run: python smoke_test_sitngo_action_safety.py
      - run: python smoke_test_sitngo_freezeout_contract.py
      - run: python smoke_test_sitngo_gameplay.py
