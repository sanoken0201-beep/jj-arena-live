name: JJ Arena Browser Stability

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'hotfix/**'
      - 'fix/**'
      - 'chore/**'
      - 'cutover/**'
      - 'ux/player-audit-phase4b*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  layout-stability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install production dependencies
        run: python -m pip install -r requirements.txt

      - name: Repeat real-browser layout and interaction gates
        run: |
          for pass in 1 2; do
            echo "Chromium stability pass ${pass}/2"
            python smoke_test_v1244_layout.py
            python smoke_test_v1243_non_poker_layout.py
            python smoke_test_v124_layout.py
            python smoke_test_player_ux_browser.py
            python smoke_test_player_ux_phase3_layout.py
            python smoke_test_player_ux_phase4_layout.py
            python smoke_test_player_ux_phase5_layout.py
            python smoke_test_responsive_parity.py
          done

      - name: Audit editorial readability at six Chromium viewport widths
        run: python smoke_test_editorial_visibility_browser.py

      - name: Upload editorial visibility screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-visibility-screenshots
          path: test-artifacts/editorial-visibility/
          if-no-files-found: ignore
