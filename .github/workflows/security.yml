name: JJ Arena Security

on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'hotfix/**'
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  auth-security:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install httpx==0.28.1

      - name: Build final served browser assets
        run: python build_served_assets.py

      - name: Compile security boundary
        run: |
          python -m py_compile security_hardening.py admin_pin_verification.py admin_api_consolidation.py admin_ledger_stabilization.py public_proxy.py non_sng_safety.py
          python -m py_compile smoke_test_auth_hardening.py smoke_test_websocket_auth.py smoke_test_public_proxy_security.py smoke_test_admin_api_consolidation.py smoke_test_admin_reversal_safety.py smoke_test_admin_export_safety.py smoke_test_non_sng_safety.py
          node --check admin_static/admin_pin_verify.js
          node --check .jj_build/static/app.js

      - name: Run authentication hardening regression
        run: python smoke_test_auth_hardening.py

      - name: Preserve WebSocket authentication boundary
        run: python smoke_test_websocket_auth.py

      - name: Enforce public gateway origin boundary
        run: python smoke_test_public_proxy_security.py

      - name: Enforce canonical admin user API
        run: python smoke_test_admin_api_consolidation.py

      - name: Enforce exactly-once admin ledger reversal
        run: python smoke_test_admin_reversal_safety.py

      - name: Harden admin export and point submission
        run: python smoke_test_admin_export_safety.py

      - name: Harden official point form submission
        run: python smoke_test_non_sng_safety.py
