name: JJ Arena Player UX Phase 4A

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'ux/player-audit-phase4a-*'

permissions:
  contents: read

jobs:
  phase4a:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install production and test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install httpx==0.28.1

      - name: Compile phase 4A files
        run: python -m py_compile player_ux_phase4.py smoke_test_player_ux_phase4.py smoke_test_player_ux_phase4_layout.py

      - name: Check final served JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          from player_ux_asset_transform import transform_app_js as phase1
          from player_ux_phase2 import transform_app_js as phase2
          from player_ux_phase3 import transform_app_js as phase3
          from player_ux_phase4 import transform_app_js as phase4
          source = Path('materialized_v1244/static/app.js').read_text(encoding='utf-8')
          Path('/tmp/jj-player-ux-phase4.js').write_text(phase4(phase3(phase2(phase1(source)))), encoding='utf-8')
          PY
          node --check /tmp/jj-player-ux-phase4.js

      - name: Run phase 4A source regression
        run: python smoke_test_player_ux_phase4.py

      - name: Run phase 4A viewport and drawer regression
        run: python smoke_test_player_ux_phase4_layout.py

      - name: Verify final served asset contract
        run: python smoke_test_learning_contrast.py
