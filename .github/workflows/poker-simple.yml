name: Poker table visibility and action recovery
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'fix/poker-simple-*', 'fix-oop-check-*', 'audit-poker-controls-*']
permissions:
  contents: read
jobs:
  poker-simple:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - run: python -m pip install -r requirements.txt playwright==1.58.0
      - run: python build_served_assets.py
      - run: node --check .jj_build/static/app.js
      - run: python smoke_test_prebuilt_assets.py
      - run: python smoke_test_oop_check_freshness.py
      - run: python smoke_test_poker_simple.py
      - run: python smoke_test_oop_check_browser.py
      - run: python smoke_test_poker_control_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poker-simple-browser
          path: test-artifacts/poker-simple

