name: JJ Arena CI

on:
  push:
    branches:
      - main
      - 'stabilize-*'
      - 'feature/**'
      - 'hotfix/**'
      - 'fix/**'
      - 'chore/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jj_arena_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jj_arena_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install production and test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install httpx==0.28.1

      - name: Compile production entrypoint and patches
        run: |
          python -m py_compile app.py app_materialized.py admin_copy_patch.py
          python -m py_compile operations_learning.py operations_learning_hardening.py resilience.py
          python -m py_compile quiz_readability.py v50_patch.py v51_patch.py v51_post_patch.py v51_final_patch.py v51_engine_compat_patch.py v51_call_signature_patch.py v52_patch.py v52_post_patch.py v53_patch.py v54_patch.py v55_patch.py v55_post_patch.py
          python -m py_compile smoke_test_v1244.py smoke_test_v1244_focus_integration.py smoke_test_v1244_layout.py smoke_test_v1243_non_poker_ui.py smoke_test_v1243_non_poker_layout.py smoke_test_v124.py smoke_test_v124_layout.py smoke_test_learning_contrast.py smoke_test_v123.py smoke_test_v123_final_audit.py smoke_test_v123_engine_integration.py smoke_test_v122.py smoke_test_v190.py smoke_test_quiz_readability_refresh.py
          python -m py_compile v49_compat_patch.py v49_patch.py v49_post_patch.py smoke_test_v121.py
          python -m py_compile daily_quiz.py quiz_bank.py v48_patch.py
          python -m py_compile mobile_poker_hotfix.py
          python -m py_compile hand_analytics.py hand_analytics_hardening.py
          python -m py_compile v47_patch.py v46_patch.py v45_patch.py v44_patch.py v43_patch.py v42_patch.py v41_patch.py v40_patch.py v39_patch.py v38_patch.py
          python -m py_compile smoke_test_hand_analytics.py smoke_test_stat_definitions.py smoke_test_card_privacy.py smoke_test_hand_analytics_postgres_v2.py smoke_test_websocket_auth.py smoke_test_mobile_poker_hotfix.py
          python -m py_compile tools/v2_runtime_snapshot.py tools/v2_contract_inventory.py smoke_test_v2_materialization_prep.py smoke_test_production_entrypoint_isolated.py smoke_test_v2_phase1_parity.py smoke_test_v2_materialized_postgres.py
          python -m py_compile materialized_v1244/server.py materialized_v1244/db.py materialized_v1244/poker_engine.py

      - name: Check reconstructed browser JavaScript syntax
        run: |
          RUNTIME="$(python -c 'from runtime_builder import build_runtime; print(build_runtime())')"
          node --check "$RUNTIME/static/app.js"
          node --check materialized_v1244/static/app.js
          node --check admin_static/ops_dashboard.js
          node --check admin_static/ops_participation.js
          node smoke_test_learning_ui.js "$RUNTIME/static/app.js"
          node smoke_test_daily_quiz_ui.js "$RUNTIME/static/app.js"

      - name: Run v2 materialization reproducibility gate
        run: python smoke_test_v2_materialization_prep.py

      - name: Run isolated production entrypoint startup gate
        run: python smoke_test_production_entrypoint_isolated.py

      - name: Run v2 Phase 1 legacy/materialized parity gate
        run: python smoke_test_v2_phase1_parity.py

      - name: Run v1.24.4 analysis UX release regression
        run: python smoke_test_v1244.py

      - name: Run v1.24.4 analysis focus SQLite integration
        run: python smoke_test_v1244_focus_integration.py

      - name: Run v1.24.4 analysis focus PostgreSQL 18 integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/jj_arena_ci
        run: python smoke_test_v1244_focus_integration.py --postgres

      - name: Run materialized v1.24.4 PostgreSQL 18 startup gate
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/jj_arena_ci
        run: python smoke_test_v2_materialized_postgres.py

      - name: Run v1.24.4 real-browser analysis/review layout regression
        run: python smoke_test_v1244_layout.py

      - name: Run focused Home Quiz Ranking UX regression
        run: python smoke_test_v1243_non_poker_ui.py

      - name: Run real-browser non-poker responsive layout regression
        run: python smoke_test_v1243_non_poker_layout.py

      - name: Run Today's JJ learning-card contrast regression
        run: python smoke_test_learning_contrast.py

      - name: Run v1.24 poker regression preservation
        run: python smoke_test_v124.py

      - name: Run v1.24 real-browser desktop/mobile poker layout regression
        run: python smoke_test_v124_layout.py

      - name: Run v1.24 real engine integration regression
        run: python smoke_test_v123_engine_integration.py

      - name: Run v1.24 safety and interaction audit regression
        run: python smoke_test_v123_final_audit.py

      - name: Run same-day quiz readability refresh regression
        run: python smoke_test_quiz_readability_refresh.py

      - name: Run Render production smoke command
        run: python smoke_test_v190.py

      - name: Run layered mobile/desktop call and bet-marker regression
        run: python smoke_test_mobile_poker_hotfix.py

      - name: Run article sharing and core API integration regression
        run: python smoke_test_learning_integration.py

      - name: Run daily quiz SQLite concurrency and rollover regression
        run: python smoke_test_daily_quiz.py

      - name: Run daily quiz PostgreSQL 18 concurrency and rollover regression
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/jj_arena_ci
        run: python smoke_test_daily_quiz.py --postgres

      - name: Run WebSocket authentication security smoke test
        run: python smoke_test_websocket_auth.py

      - name: Run hand analytics SQLite integration smoke test
        run: python smoke_test_hand_analytics.py

      - name: Run statistic-definition edge-case smoke test
        run: python smoke_test_stat_definitions.py

      - name: Run completed-hand card privacy smoke test
        run: python smoke_test_card_privacy.py

      - name: Run hand analytics PostgreSQL 18 integration smoke test
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/jj_arena_ci
        run: python smoke_test_hand_analytics_postgres_v2.py

      - name: Run prior v1.18.6 regression smoke test
        run: python smoke_test_v186.py

      - name: Audit user-facing terminology
        run: python audit_ui_labels.py
