name: JJ Arena CI

on:
  push:
    branches:
      - main
      - 'stabilize-*'
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile production entrypoint and patches
        run: |
          python -m py_compile app.py
          python -m py_compile hand_analytics.py
          python -m py_compile hand_analytics_hardening.py
          python -m py_compile v44_patch.py
          python -m py_compile v43_patch.py
          python -m py_compile v42_patch.py
          python -m py_compile v41_patch.py
          python -m py_compile v40_patch.py
          python -m py_compile v39_patch.py
          python -m py_compile v38_patch.py
          python -m py_compile smoke_test_hand_analytics.py

      - name: Check reconstructed browser JavaScript syntax
        run: |
          RUNTIME="$(python -c 'from runtime_builder import build_runtime; print(build_runtime())')"
          node --check "$RUNTIME/static/app.js"

      - name: Run latest reconstruction smoke test
        run: python smoke_test_v190.py

      - name: Run hand analytics integration smoke test
        run: python smoke_test_hand_analytics.py

      - name: Run prior v1.18.6 regression smoke test
        run: python smoke_test_v186.py

      - name: Audit user-facing terminology
        run: python audit_ui_labels.py
