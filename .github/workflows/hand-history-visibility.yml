name: Participant Hand History Visibility

on:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Compile visibility integration
        run: |
          python -m py_compile hand_history_visibility.py smoke_test_hand_history_visibility.py app_materialized.py app.py

      - name: Verify participant-only completed-hand history
        run: python smoke_test_hand_history_visibility.py
