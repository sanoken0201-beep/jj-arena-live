name: JJ Arena Player UX Phase 4C

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'ux/player-audit-phase4c*'

permissions:
  contents: read

jobs:
  phase4c:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install production and test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install httpx==0.28.1

      - name: Build final served browser assets
        run: python build_served_assets.py

      - name: Compile telemetry files
        run: python -m py_compile ux_telemetry.py player_ux_phase6.py smoke_test_ux_telemetry.py smoke_test_player_ux_phase6.py

      - name: Check final production JavaScript syntax
        run: |
          node --check .jj_build/static/app.js
          node --check admin_static/ux_telemetry.js

      - name: Run privacy and aggregation regression
        run: python smoke_test_ux_telemetry.py

      - name: Run client telemetry regression
        run: python smoke_test_player_ux_phase6.py

      - name: Preserve v67 lossless asset transfer
        run: python smoke_test_asset_encoding.py

      - name: Verify served v68 asset contract
        run: python smoke_test_learning_contrast.py
