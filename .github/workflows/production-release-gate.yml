name: Production Release Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-gate:
    name: production release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install production dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile release gate
        run: python -m py_compile production_release_gate.py build_served_assets.py poker_table_focus.py
      - name: Run production release gate
        run: python production_release_gate.py
